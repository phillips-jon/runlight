[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runlight"
version = "0.0.0"
description = "Privacy friendly web analytics that lives inside your Python app. Mount a route, add a script tag, read your stats at /runlight."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jon C. Phillips" }]
keywords = ["analytics", "privacy", "web analytics", "short links", "django", "flask", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Log Analysis",
  "Typing :: Typed",
]
# The core has no dependencies: SQLite, HTTP, crypto, and zones come from the standard library.
dependencies = []

[project.optional-dependencies]
# zoneinfo reads the system's zone database; Windows has none, so install this there.
tzdata = ["tzdata"]
# Stores.postgres(), on psycopg 3.
postgres = ["psycopg>=3.2"]
# Stores.mysql(), for MySQL 8.4 and MariaDB 11.4 and later.
mysql = ["pymysql>=1.1"]

[project.scripts]
runlight = "runlight.server.cli:main"

[project.urls]
Homepage = "https://runlight.sh"
Documentation = "https://runlight.sh/docs/python/"
Source = "https://github.com/phillips-jon/runlight/tree/main/packages/python"
Issues = "https://github.com/phillips-jon/runlight/issues"

[dependency-groups]
# psycopg and PyMySQL for the Postgres and MySQL tests (run when RUNLIGHT_TEST_PG
# or RUNLIGHT_TEST_MYSQL is set), and Django, Flask, FastAPI and httpx for the
# framework adapters' tests.
dev = ["pytest>=8", "psycopg[binary]>=3.2", "pymysql>=1.1", "django>=5.2", "flask>=3", "fastapi>=0.115", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/runlight"]

[tool.hatch.build.targets.sdist]
include = ["src/runlight", "README.md", "LICENSE", "DESIGN.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
