# Called by every workflow a release tag starts (docker.yml, release.yml,
# php-split.yml, php-plugins-split.yml, pypi.yml, hex.yml, maven.yml,
# nuget.yml, crates.yml) before it publishes: finds the runs of CI and of the
# workflow that tests what it publishes (python.yml for PyPI, elixir.yml for
# Hex, java.yml for Maven Central, dotnet.yml for NuGet, rust.yml for
# crates.io) on the release tag's commit, waits for them, and fails unless
# every one passed. These run on pushes to main, not on tags, so the runs it
# waits for are the ones on the push to main that carried the tagged commit
# (`npm run release` makes the commit and the tag, and both are pushed
# together). A tag on a commit that never reached main has no such run and
# publishes nothing. Each workflow named must run on every push to main (no
# paths filter), or a release commit that leaves its package alone would
# have no run to wait for.
#
# Started by the tag's push, the commit is the tag's (github.sha); started by
# hand with a tag, it is the commit that tag names now. Either way it is the
# job's output "sha", which the publish jobs check out, so what is published
# is exactly what CI tested. A CI run that failed and was then run again
# counts by its latest attempt.
name: CI passed

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for a run started by hand; empty for a tag's push
        type: string
        default: ""
      workflows:
        description: The workflow files that must pass on the tagged commit, separated by spaces
        type: string
        default: ci.yml
    outputs:
      sha:
        description: The tagged commit, which CI passed
        value: ${{ jobs.wait.outputs.sha }}

permissions: {}

jobs:
  wait:
    runs-on: ubuntu-latest
    # Runs that have not finished in two hours are not going to.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.wait.outputs.sha }}
    steps:
      - name: Wait for the workflows on the tagged commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then echo "not a release tag: $TAG"; exit 1; fi
          if [ "$EVENT" = "push" ]; then
            sha="$PUSHED_SHA"
          else
            sha="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "could not find the commit $TAG names"; exit 1; fi
          echo "$TAG is $sha"
          # A run shows up a few seconds after its push; give each ten minutes.
          appear=$((SECONDS + 600))
          if [ -z "${WORKFLOWS// /}" ]; then echo "no workflows to wait for"; exit 1; fi
          for workflow in $WORKFLOWS; do
            if ! [[ "$workflow" =~ ^[a-z0-9-]+\.yml$ ]]; then echo "not a workflow file: $workflow"; exit 1; fi
            while :; do
              run="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$sha&event=push&branch=main&per_page=1" \
                --jq '.workflow_runs[0] // empty | [.status, (.conclusion // "none"), .html_url] | @tsv')"
              if [ -z "$run" ]; then
                if [ "$SECONDS" -ge "$appear" ]; then
                  echo "$workflow has no run on a push to main for $sha; push the tagged commit to main, let it pass, then start this again."
                  exit 1
                fi
                echo "No $workflow run for $sha yet"
              else
                IFS=$'\t' read -r status conclusion url <<< "$run"
                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" = "success" ]; then
                    echo "$workflow passed on $sha: $url"
                    break
                  fi
                  echo "$workflow did not pass on $sha ($conclusion): $url"
                  exit 1
                fi
                echo "$workflow is $status on $sha: $url"
              fi
              sleep 30
            done
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
