# Every push and pull request: the dash check (files and commit messages),
# typecheck, the tests against SQLite, Postgres, and MySQL or MariaDB, and a
# build, on the two Node majors better-sqlite3 13 supports. The PHP package's
# tests run in a job of their own, on PHP 8.2 and 8.4.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No em or en dashes in commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-dashes.mjs --commits "$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch (before is all zeros) or a force push: the head commit only.
            node scripts/check-dashes.mjs --commits -1 "$AFTER"
          else
            node scripts/check-dashes.mjs --commits "$BEFORE..$AFTER"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Node major also runs against one of MySQL and MariaDB.
        include:
          - node: 22
            mysql: public.ecr.aws/docker/library/mysql:8.4
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
          - node: 24
            mysql: public.ecr.aws/docker/library/mariadb:11.4
            mysql-health: healthcheck.sh --connect --innodb_initialized
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.mysql-health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  # The PHP package (packages/php), on the oldest PHP it supports and a current one, against the same three
  # kinds of database. Each PHP version also runs against one of MySQL and MariaDB.
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            mysql: public.ecr.aws/docker/library/mysql:8.4
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
          - php: "8.4"
            mysql: public.ecr.aws/docker/library/mariadb:11.4
            mysql-health: healthcheck.sh --connect --innodb_initialized
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.mysql-health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sodium, timezonedb, zlib
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # The Craft plugin has no database to run against here, so each of its
  # classes is loaded against a real Craft install, on the oldest PHP and the
  # newest Craft it allows, which catches what php -l cannot.
  craft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: curl, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-plugins
        working-directory: plugins/craft
      - run: composer update --no-interaction --no-progress --prefer-dist --no-plugins
        working-directory: plugins/craft
      - run: php scripts/craft-load.php
