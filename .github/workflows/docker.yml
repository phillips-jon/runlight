# A release tag -> the standalone server's Docker image, built from the
# Dockerfile for linux/amd64 and linux/arm64 and pushed to
# ghcr.io/runlightsh/runlight, tagged with the version (0.1.0) and, for the
# highest stable release, latest. A prerelease (0.2.0-beta.1) is never latest,
# and neither is a rerun for an older tag. Pushing the same tags again
# replaces them, so a rerun is safe. Can also be started by hand for a tag.
#
# Stays off until the repository variable DOCKER_ENABLED is "true". It needs
# no secret: the workflow's own token may write this repository's packages.
# The first push makes the package private; make it public once, under the
# package's settings on GitHub, so `docker pull` needs no login.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build (v0.1.0, say)
        required: true

permissions:
  contents: read

concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  # CI must pass on the tagged commit first (ci-passed.yml).
  ci:
    if: vars.DOCKER_ENABLED == 'true'
    uses: ./.github/workflows/ci-passed.yml
    permissions:
      actions: read
      contents: read
    with:
      tag: ${{ inputs.tag }}

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - name: Check the tag against the server's version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          server="$(node -p 'require("./packages/server/package.json").version')"
          if [ "$server" != "$version" ]; then echo "packages/server is $server, the tag is $TAG"; exit 1; fi
          latest=false
          case "$version" in
            *-*) ;;
            *)
              highest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
                | sed -n 's#^refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
                | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
              if [ -z "$highest" ]; then echo "could not list the release tags"; exit 1; fi
              if [ "$highest" = "$version" ]; then latest=true; fi
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$TAG builds ghcr.io/runlightsh/runlight:$version (latest: $latest)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/runlightsh/runlight
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Runlight
            org.opencontainers.image.description=Privacy friendly web analytics for any number of sites.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.ci.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
