# runlight.sh: a static site served straight off disk.
#
# Install as /etc/nginx/sites-available/runlight.sh and symlink it into
# sites-enabled. On a new host, install the port 80 block FIRST, reload, get
# the certificate through the acme-challenge location, and only then add the
# 443 blocks: nginx will not start if a ssl_certificate it names is missing.
#
# The root follows /var/www/runlight.sh, a symlink to the live release, so
# a deploy is one rename and needs no reload.
#
# One thing is not static: POST /contact goes to the contact form service
# (deploy/contact/server.mjs, run by systemd on 127.0.0.1:3791).

# At most 5 contact form posts a minute from one address, with a burst of 3.
# Files in sites-enabled are included inside the http block, which is where
# limit_req_zone has to be. The zone name is unique to this site.
limit_req_zone $binary_remote_addr zone=runlight_contact:1m rate=5r/m;
# And at most 20 a minute from everyone together ($server_name is the same
# for every request), with a burst of 10. The service keeps its own limits
# on what it sends: per IPv4 address or IPv6 /64, and an hourly and daily
# cap on everything (LIMITS in deploy/contact/server.mjs).
limit_req_zone $server_name zone=runlight_contact_all:1m rate=20r/m;

# Cache lifetimes by path. Every header below is set once at server level and
# no location adds its own, because a location with any add_header drops all
# the server-level ones (HSTS, CSP and the rest would vanish from it). An
# empty value sends no header.
map $uri $runlight_cache {
    # style.<hash>.css, site.<hash>.js, theme.<hash>.js: the name changes
    # whenever the content does.
    "~^/assets/[a-z]+\.[0-9a-f]{10}\.(css|js)$"  "public, max-age=31536000, immutable";
    # Screenshots and icons keep their names, so they are cached for a day.
    ~^/assets/                                    "public, max-age=86400";
    # The contact service's redirects are never cached.
    /contact                                      "no-store";
    # Pages revalidate so a deploy shows at once.
    default                                       "public, max-age=300, must-revalidate";
}

# The server runs nginx 1.24, which needs http2 on the listen line. From
# 1.25.1 that form is deprecated in favour of a separate `http2 on;`.

# www redirects to the apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.runlight.sh;
    ssl_certificate     /etc/letsencrypt/live/runlight.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runlight.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://runlight.sh$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name runlight.sh;

    ssl_certificate     /etc/letsencrypt/live/runlight.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runlight.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/runlight.sh/site/dist;
    index index.html;

    # The pages load only same-origin CSS, JS, images, and fetches (the docs'
    # Copy markdown button fetches the page's .md), plus the Adobe Fonts kit
    # (use.typekit.net, whose stylesheet imports a page-view count from
    # p.typekit.net): no inline styles or scripts, no data: images, no frames.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://use.typekit.net https://p.typekit.net; img-src 'self'; font-src 'self' https://use.typekit.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $runlight_cache;

    # Nothing here is uploaded.
    client_max_body_size 64k;

    # Dotfiles are never served.
    location ~ /\.(?!well-known/) { return 404; }

    location /assets/ {
        access_log off;
    }

    # The docs pages as markdown (/docs/<page>/index.md), for Copy markdown
    # and for pasting into an agent: nginx's mime.types has no .md either.
    location ~ ^/docs/([a-z0-9-]+/)?index\.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    # The not-found page is only ever an error response, never a 200 of its
    # own; error_page still reaches it internally.
    location = /404.html { internal; }
    location = /404 { return 404; }
    location = /50x.html { internal; }
    location = /50x { return 404; }

    # The contact form posts here. A GET (someone typing the address) goes to
    # the form; anything else but POST is refused. The service answers every
    # post with a redirect to /contact/sent/ or /contact/error/, and when it is
    # down, busy or sent too much, nginx sends the error page the same way.
    location = /contact {
        if ($request_method ~ ^(GET|HEAD)$) { return 301 /contact/; }
        if ($request_method != POST) { return 405; }
        limit_req zone=runlight_contact burst=3 nodelay;
        limit_req zone=runlight_contact_all burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        error_page 413 429 500 502 503 504 = @contact_error;
    }
    location @contact_error { return 303 /contact/error/; }

    # Clean URLs: /docs/php serves /docs/php/index.html or /docs/php.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name runlight.sh www.runlight.sh;
    location ~ /\.(?!well-known/) { return 404; }
    # Kept after the redirect, because renewals use this path too.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://runlight.sh$request_uri; }
}
